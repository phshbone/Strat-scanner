name: Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'live-candidates-ui.js'
      - 'chart-workspace-ui.js'
      - 'chart-live-watch.js'
      - 'research-console-wiring.js'
      - 'worker/**'
      - 'tests/live-smoke.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/live-smoke-test.yml'

permissions:
  contents: read

jobs:
  playwright-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_BASE_URL: https://phshbone.github.io/Strat-scanner/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test tooling
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed app shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl -fsSL "${LIVE_BASE_URL}?deploy-wait=${GITHUB_SHA}-${attempt}" -o deployed-index.html && grep -q "Trading Research Console" deployed-index.html; then
              exit 0
            fi
            sleep 5
          done
          echo "Deployed app shell did not become reachable"
          exit 1

      - name: Run deployed browser smoke test
        run: npm run test:live-smoke

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
