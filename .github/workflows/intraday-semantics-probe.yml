name: Intraday Semantics Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-spy-intraday-semantics.js'
      - 'period-resolver.js'
      - 'tests/period-resolver-validation.js'
      - '.github/workflows/intraday-semantics-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe-spy-intraday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate period resolver
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee probe.log) 2>&1
          node tests/period-resolver-validation.js

      - name: Probe SPY intraday semantics through Cloudflare
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          node scripts/probe-spy-intraday-semantics.js 2>&1 | tee -a probe.log

      - name: Publish intraday semantics receipt
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('fs');
            const issue_number = 2;
            const validateOutcome = String(process.env.VALIDATE_OUTCOME || 'unknown').toUpperCase();
            const probeOutcome = String(process.env.PROBE_OUTCOME || 'unknown').toUpperCase();
            const overall = validateOutcome === 'SUCCESS' && probeOutcome === 'SUCCESS' ? 'SUCCESS' : 'FAILURE';
            let log = 'probe.log was not produced';
            if (fs.existsSync('probe.log')) log = fs.readFileSync('probe.log', 'utf8');
            const max = 12000;
            if (log.length > max) log = '…(truncated)…\n' + log.slice(-max);
            const body = [
              '# Intraday Semantics Probe Receipt',
              '',
              `**Outcome:** ${overall}`,
              `**Period resolver:** ${validateOutcome}`,
              `**Live probe:** ${probeOutcome}`,
              `**Commit:** \`${context.sha}\``,
              `**Run:** ${context.runId}`,
              `**Published:** ${new Date().toISOString()}`,
              '',
              '5m / 15m / 30m are validated against the production resolver. 1h remains observation-only and must not be promoted to production semantics from this receipt alone.',
              '',
              '```text',
              log.replace(/```/g, '``\\`'),
              '```'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
