name: Engine Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run validation harnesses
        shell: bash
        run: |
          set -euo pipefail
          echo "Running deterministic engine validation harnesses"
          for f in tests/*validation*.js; do
            echo "==> $f"
            node "$f"
          done
