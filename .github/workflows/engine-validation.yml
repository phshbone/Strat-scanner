name: Engine Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run validation harnesses
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee validation.log) 2>&1
          echo "Running deterministic engine validation harnesses"
          shopt -s nullglob
          files=(tests/*validation*.js tests/*validation*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No validation harnesses found"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "==> $f"
            node "$f"
          done

      - name: Publish validation receipt
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const fs = require('fs');
            const issue_number = 1;
            const outcome = String(process.env.VALIDATION_OUTCOME || 'unknown').toUpperCase();
            let log = 'validation.log was not produced';
            if (fs.existsSync('validation.log')) {
              log = fs.readFileSync('validation.log', 'utf8');
            }
            const max = 12000;
            if (log.length > max) log = '…(truncated)…\n' + log.slice(-max);
            const body = [
              '# Automated Validation Receipt',
              '',
              `**Outcome:** ${outcome}`,
              `**Commit:** \`${context.sha}\``,
              `**Branch:** \`${context.ref}\``,
              `**Run:** ${context.runId}`,
              `**Published:** ${new Date().toISOString()}`,
              '',
              'This receipt is written by the Engine Validation workflow so connector clients can verify push-triggered validation without relying on classic commit-status visibility.',
              '',
              '```text',
              log.replace(/```/g, '``\\`'),
              '```'
            ].join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
